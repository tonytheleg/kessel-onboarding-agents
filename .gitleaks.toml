# .gitleaks.toml — gitleaks configuration tuned for kessel-onboarding-agents.
#
# This repo is Markdown, JSON, and shell/skill content — not compiled software.
# The allow-list below suppresses known false positives for documentation
# placeholders and Jira issue keys while preserving detection of real secrets.
#
# Reference: https://github.com/zricethezav/gitleaks#configuration
# Policy:    docs/responsible-use.md

title = "kessel-onboarding-agents gitleaks config"

[extend]
# Start from the default ruleset so we inherit all standard secret patterns.
useDefault = true

# ── Global allow-list ────────────────────────────────────────────────────────
# Entries here suppress matches across ALL rules.
[allowlist]
description = "kessel-onboarding-agents approved placeholders and known-safe patterns"

regexes = [
    # Bracketed placeholders: <token>, <api-key>, <password>, <secret>, etc.
    '''<(token|api[-_]?key|password|secret|credential|private[-_]?key|access[-_]?key|client[-_]?secret|auth[-_]?key)>''',
    # ALL-CAPS placeholder conventions: YOUR_TOKEN, REPLACE_ME, MY_SECRET, etc.
    '''(YOUR_|REPLACE_|MY_|EXAMPLE_|PLACEHOLDER_)[A-Z0-9_]{3,}''',
    # "changeme" and "dummy" used in examples
    '''(changeme|dummy|fake|placeholder|redacted|sanitized)''',
    # RFC 5737 / documentation IP placeholders
    '''192\.0\.2\.|198\.51\.100\.|203\.0\.113\.''',
    # Example domains (RFC 2606)
    '''@(example\.com|example\.org|example\.net)''',
    # SPDX license identifiers (contain the word "Apache" etc. — not secrets)
    '''SPDX-License-Identifier''',
    # Markdown/YAML front-matter style key: value that is clearly structural
    '''^\s*(name|description|title|stage|image|script|rules|artifacts|when|expire_in)\s*:''',
    # Repeated-character GitLab PAT placeholders (e.g. glpat-xxxxxxxxxxxxxxxxxxxx) — zero entropy
    '''glpat-x{10,}''',
    # Jira issue key patterns used throughout this repo's docs/config examples
    # (e.g. "RHCLOUD-48564", "CRCPLAN-100", "TUSC-891") — standard identifiers, not secrets.
    '''[A-Z]{2,10}-[0-9]{1,6}''',
    # Config field examples that look like tokens but are placeholders
    # (docs/configuration.md template values)
    '''your-atlassian-api-token|YOUR_CLOUD_ID|YOUR_ATLASSIAN_MCP_SERVER_NAME''',
]

# Specific file paths that are safe to skip entirely
paths = [
    # This config file itself
    '''\.gitleaks\.toml''',
    # Local artifacts (also gitignored, but skip defensively if ever present in a scan)
    '''^artifacts/''',
]

# ── Rule overrides ────────────────────────────────────────────────────────────
# Use [[rules]] to add repo-specific detectors on top of the default ruleset.

# Detect GitLab Personal Access Tokens pasted into docs
[[rules]]
id          = "gitlab-pat-in-docs"
description = "GitLab Personal Access Token (glpat-…) found in documentation"
regex       = '''glpat-[0-9a-zA-Z_\-]{20}'''
tags        = ["gitlab", "pat", "secret"]

  [rules.allowlist]
  regexes = [
    '''glpat-<[a-z\-]+>''',   # allow glpat-<your-token> angle-bracket placeholders
    '''glpat-x{10,}''',        # allow glpat-xxx… repeated-char placeholders (zero entropy)
  ]

# Detect Atlassian API tokens (the .env fallback described in docs/configuration.md)
[[rules]]
id          = "atlassian-api-token-assignment"
description = "Possible Atlassian/Jira API token assigned in a .env-style line"
regex       = '''JIRA_API_TOKEN\s*=\s*[A-Za-z0-9]{20,}'''
tags        = ["atlassian", "jira", "secret"]

  [rules.allowlist]
  regexes = [
    '''JIRA_API_TOKEN\s*=\s*your-atlassian-api-token''',
    '''JIRA_API_TOKEN\s*=\s*<[a-z\-]+>''',
  ]

# Detect JWT tokens (could appear in skills/examples incorrectly)
[[rules]]
id          = "jwt-token"
description = "JSON Web Token (Bearer eyJ…)"
regex       = '''eyJ[A-Za-z0-9+/=]{20,}\.[A-Za-z0-9+/=]{20,}\.[A-Za-z0-9+/=_\-]{20,}'''
tags        = ["jwt", "secret"]

  [rules.allowlist]
  regexes   = ['''eyJ<[a-z\-]+>''']    # allow clearly templated examples

# Detect OpenAI API keys (relevant: skills may reference AI tools directly)
[[rules]]
id          = "openai-api-key"
description = "OpenAI API key (sk-…)"
regex       = '''sk-[a-zA-Z0-9]{48}'''
tags        = ["openai", "secret"]

  [rules.allowlist]
  regexes   = ['''sk-<[a-z\-]+>''']    # allow sk-<your-key> placeholders

# Detect Slack bot and user tokens (in case Slack MCP integrations get referenced)
[[rules]]
id          = "slack-token"
description = "Slack bot token (xoxb-…) or user token (xoxp-…)"
regex       = '''xox[bp]-[0-9]+-[a-zA-Z0-9]+'''
tags        = ["slack", "secret"]

  [rules.allowlist]
  regexes   = ['''xox[bp]-<[a-z\-]+>''']    # allow xoxb-<your-token> placeholders
